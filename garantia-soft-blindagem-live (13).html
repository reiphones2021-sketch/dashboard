<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radar de Garantia · Soft Blindagem</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --bg: #0a1420;
    --panel: rgba(15,25,35,0.78);
    --panel-2: rgba(22,48,58,0.85);
    --line: #1c3a45;
    --text: #e8f0f5;
    --muted: #8b96a3;
    --shield: #3fb8c9;
    --amber: #f0b93c;
    --coral: #ff7a68;
    --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    padding: 28px 18px 60px;
    position: relative;
    overflow-x: hidden;
  }
  .bgsvg{ position:fixed; inset:0; opacity:0.14; pointer-events:none; z-index:0; }
  .scanline{
    position:fixed; left:0; right:0; height:160px; pointer-events:none; z-index:0;
    background: linear-gradient(to bottom, transparent, rgba(63,184,201,0.07), transparent);
    animation: scan 7s linear infinite;
  }
  @keyframes scan{ 0%{ top:-160px; } 100%{ top:100%; } }
  .sysreadout{
    position:fixed; top:20px; right:20px; font-family: var(--mono); font-size:9px; color:#2f7d8a;
    text-align:right; line-height:1.5; opacity:0.75; z-index:0; display:none;
  }
  @media (min-width:760px){ .sysreadout{ display:block; } }

  .wrap{ max-width: 920px; margin: 0 auto; position:relative; z-index:1; }
  header{
    display:flex; align-items:flex-end; justify-content:space-between; gap:16px;
    margin-bottom: 6px; flex-wrap: wrap;
  }
  .brand .statusrow{ display:flex; align-items:center; gap:7px; }
  .brand .livedot{ width:6px; height:6px; border-radius:50%; background:var(--shield); box-shadow:0 0 7px var(--shield); animation: blink 2s ease-in-out infinite; }
  @keyframes blink{ 0%,100%{ opacity:1; } 50%{ opacity:0.35; } }
  .brand .eyebrow{
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; color: var(--shield);
    text-transform: uppercase;
  }
  .brand h1{
    font-family: 'Space Grotesk', 'Inter', sans-serif;
    font-size: 26px; margin: 4px 0 0; font-weight: 600; letter-spacing: -0.01em;
  }
  .terminal-line{
    font-family: var(--mono); font-size: 11.5px; color: #4fa3ad; margin: 6px 0 20px; opacity:0.9;
  }
  .terminal-line .caret{ display:inline-block; width:6px; height:12px; background:var(--shield); margin-left:2px; vertical-align:middle; animation: blink 1s step-end infinite; }
  .status-pill{
    font-family: var(--mono); font-size: 12px; color: var(--muted);
    background: var(--panel); border: 1px solid var(--line); padding: 7px 13px; border-radius: 999px;
    display:flex; align-items:center; gap:7px;
  }
  .status-dot{ width:7px; height:7px; border-radius:50%; background: var(--shield); }
  .status-dot.err{ background: var(--coral); }
  .status-dot.loading{ background: var(--amber); animation: pulse 1s infinite; }
  @keyframes pulse{ 50%{ opacity:0.3; } }

  .picker{
    display:flex; align-items:center; gap:10px; background: var(--panel); border:1px solid var(--line);
    border-radius: 14px; padding: 14px 16px; margin-bottom: 22px; flex-wrap:wrap;
  }
  .picker label{ font-size:12.5px; color: var(--muted); }
  .picker input[type=date]{
    background: var(--panel-2); border:1px solid var(--line); color: var(--text);
    border-radius:8px; padding:8px 10px; font-family: var(--mono); font-size:13px;
  }
  .quickbtns{ display:flex; gap:8px; margin-left:auto; flex-wrap:wrap; }
  .qbtn{
    font-family: inherit; font-size:12.5px; font-weight:600; border-radius:999px; padding:7px 13px;
    border:1px solid var(--line); background: var(--panel-2); color: var(--text); cursor:pointer;
  }
  .qbtn.active{ background: var(--shield); color:#06211d; border-color: var(--shield); }

  .summary{ display:grid; grid-template-columns: repeat(3,1fr); gap:12px; margin-bottom: 26px; }
  .stat{ position:relative; background: var(--panel); border:1px solid var(--line); border-radius: 14px; padding: 16px; }
  .stat .n{ font-family:'Space Grotesk', sans-serif; font-size: 28px; font-weight:600; line-height:1; }
  .stat.hoje .n{ color: var(--coral); }
  .stat.semana .n{ color: var(--amber); }
  .stat .l{ color: var(--muted); font-size: 11.5px; margin-top: 6px; font-family: var(--mono); text-transform:uppercase; letter-spacing:.03em; }
  .stat::before, .stat::after{ content:''; position:absolute; width:8px; height:8px; border-color: var(--shield); opacity:0.7; }
  .stat::before{ top:-1px; left:-1px; border-top:1.5px solid; border-left:1.5px solid; border-top-left-radius:4px; }
  .stat::after{ bottom:-1px; right:-1px; border-bottom:1.5px solid; border-right:1.5px solid; border-bottom-right-radius:4px; }

  section{ margin-bottom: 30px; }
  .sec-head{ display:flex; align-items:center; gap:10px; margin-bottom: 12px; }
  .sec-head h2{ font-family:'Space Grotesk', sans-serif; font-size: 16px; margin:0; font-weight:600; }

  .card{
    position:relative; background: var(--panel); border:1px solid var(--line); border-radius: 14px;
    padding: 14px 16px; margin-bottom: 10px;
    display:flex; align-items:center; gap:14px; flex-wrap: wrap;
  }
  .card::before, .card::after{ content:''; position:absolute; width:11px; height:11px; border-color: var(--shield); opacity:0.7; }
  .card::before{ top:-1px; left:-1px; border-top:1.5px solid; border-left:1.5px solid; border-top-left-radius:4px; }
  .card::after{ bottom:-1px; right:-1px; border-bottom:1.5px solid; border-right:1.5px solid; border-bottom-right-radius:4px; }
  .card .who{ flex: 1 1 220px; min-width: 180px; }
  .card .name{ font-weight:600; font-size:15px; }
  .card .plan{ color: var(--muted); font-size: 12.5px; margin-top:2px; font-family: var(--mono); }
  .bar-wrap{ flex: 1 1 160px; min-width: 140px; }
  .bar-track{ height:6px; background: var(--panel-2); border-radius: 4px; overflow:hidden; }
  .bar-fill{ height:100%; border-radius: 4px; box-shadow: 0 0 6px rgba(255,122,104,0.45); }
  .bar-label{ font-size: 11px; color: var(--muted); margin-top:5px; font-family: var(--mono); }
  .btn{
    font-family: inherit; font-size: 13px; font-weight: 600; border-radius: 999px;
    padding: 8px 14px; border: none; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; gap:6px;
  }
  .btn.wa{ background: var(--shield); color: #06211d; }
  .btn.none{ background: var(--panel-2); color: var(--muted); border:1px dashed var(--line); cursor:default; }
  .empty{ color: var(--muted); font-size: 13.5px; padding: 18px 4px; }
  .errbox{
    background: var(--panel); border:1px solid var(--coral); border-radius:14px; padding:18px; color: var(--text); font-size:13.5px; line-height:1.6;
  }
  .errbox b{ color: var(--coral); }
  .foot-note{ text-align:center; color: var(--muted); font-size: 12px; margin-top: 24px; position:relative; z-index:1; }
</style>
</head>
<body>

  <defs>

<div class="wrap">

  <div class="picker">

<script>
const SHEET_ID = '1K4b2wBs3dQ82FHYoUoy-oalZPkFlFrelcnXfQ0nJmiI';
const SHEET_NAME = 'P&L SOFT VAREJO';

// Duração de cada nível de garantia.
// MASSA usa MESES DE CALENDÁRIO (4 meses corridos), não dias fixos —
// ex: comprou 16/03 vence 16/07. Os demais são dias fixos.
const TIER_DURATION = {
  'DE BOAS': { type: 'days', value: 40 },
  'MASSA': { type: 'months', value: 4 },
  'BARRIL': { type: 'days', value: 400 },
  'GARANTIA ESTENDIDA': { type: 'days', value: 400 } // mesma duração do Barril
};
const TIER_LABEL = {
  'DE BOAS': 'PLANO DE BOAS',
  'MASSA': 'PLANO MASSA',
  'BARRIL': 'PLANO BARRIL',
  'GARANTIA ESTENDIDA': 'GARANTIA ESTENDIDA'
};

// Mapeia o texto de PRODUTO VENDIDO pro "nível" de garantia (ignora a variante: lisa/fosca/privacidade/etc)
function baseTierFromProduto(produtoNorm){
  if(produtoNorm === 'PLANO DE BOAS') return 'DE BOAS';
  if(produtoNorm.startsWith('PLANO MASSA')) return 'MASSA';
  if(produtoNorm.startsWith('PLANO BARRIL')) return 'BARRIL';
  if(produtoNorm === 'GARANTIA ESTENDIDA') return 'GARANTIA ESTENDIDA';
  return null;
}

// Os 4 tipos de upgrade que existem na planilha.
// "origin" = nível que o cliente tinha antes (usado só pra tentar casar com a compra original).
// "dest" = nível final que vale pra calcular o vencimento.
const UPGRADE_MAP = {
  'UPGRADE PLANO DE BOAS - PLANO MASSA': { origin: 'DE BOAS', dest: 'MASSA' },
  'UPGRADE PLANO MASSA - PLANO BARRIL': { origin: 'MASSA', dest: 'BARRIL' },
  'UPGRADE PLANO DE BOAS - PLANO BARRIL': { origin: 'DE BOAS', dest: 'BARRIL' },
  'UPGRADE GARANTIA ESTENDIDA': { origin: null, dest: 'GARANTIA ESTENDIDA' }
};

// Soma meses de calendário respeitando o tamanho de cada mês (ex: 31/01 + 1 mês = 28/02 ou 29/02)
function addMonthsClamped(date, months){
  const y = date.getFullYear(), m = date.getMonth(), d = date.getDate();
  const total = m + months;
  const targetYear = y + Math.floor(total / 12);
  const targetMonth = ((total % 12) + 12) % 12;
  const daysInTargetMonth = new Date(targetYear, targetMonth + 1, 0).getDate();
  return new Date(targetYear, targetMonth, Math.min(d, daysInTargetMonth));
}

let ALL_CLIENTS = [];

function parseBRDate(v){
  if(v === null || v === undefined || v === '') return null;
  if(v instanceof Date) return isNaN(v.getTime()) ? null : v;
  v = String(v).trim();

  // Formato do Google Sheets (gviz out:json): "Date(2024,11,12)" ou com hora "Date(2024,11,12,0,0,0)"
  let g = v.match(/^Date\((\d+),(\d+),(\d+)(?:,(\d+),(\d+),(\d+))?\)$/);
  if(g){
    const y = parseInt(g[1],10), mo = parseInt(g[2],10), d = parseInt(g[3],10);
    const dt = new Date(y, mo, d); // mês já vem zero-indexado do Google
    return isNaN(dt.getTime()) ? null : dt;
  }

  // Formato brasileiro DD/MM/AAAA
  let m = v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
  if(m){
    let d = parseInt(m[1],10), mo = parseInt(m[2],10)-1, y = parseInt(m[3],10);
    if(y < 100) y += 2000;
    let dt = new Date(y, mo, d);
    return isNaN(dt.getTime()) ? null : dt;
  }

  let iso = new Date(v);
  return isNaN(iso.getTime()) ? null : iso;
}
function fmtDate(d){ return d.toLocaleDateString('pt-BR'); }
function onlyDigits(s){ return String(s===null||s===undefined?'':s).replace(/\D/g,''); }
function normPlan(p){ return (p||'').toString().trim().toUpperCase(); }
function dateKey(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function waLink(phone, name, plan, vencDate){
  const digits = onlyDigits(phone);
  if(!digits) return null;
  const full = digits.length <= 11 ? '55' + digits : digits;
  const msg = `Oi ${name.split(' ')[0]}! Aqui é da Soft Blindagem 😊 Vimos que sua garantia (${plan}) está vencendo em ${fmtDate(vencDate)}. Quer renovar e continuar protegido(a)? Consigo te passar as condições agora mesmo!`;
  return `https://wa.me/${full}?text=${encodeURIComponent(msg)}`;
}

function buildDevice(cliente, dt, tier, contato, preco, modelo, viaUpgrade){
  const dur = TIER_DURATION[tier];
  let venc;
  if(dur.type === 'days'){
    venc = new Date(dt);
    venc.setDate(venc.getDate() + dur.value);
  }else{
    venc = addMonthsClamped(dt, dur.value);
  }
  const dias = diffDays(dt, venc);
  const label = TIER_LABEL[tier] + (viaUpgrade ? ' (upgrade)' : '');
  return { cliente, data: dt, produto: label, tier, contato, preco, modelo, venc, dias };
}

function extractModelo(r){
  const m1 = (r['MARCA/MODELO'] === null || r['MARCA/MODELO'] === undefined) ? '' : String(r['MARCA/MODELO']).trim();
  const m2 = (r['MODELO'] === null || r['MODELO'] === undefined) ? '' : String(r['MODELO']).trim();
  if(m1 && m2 && m1.toUpperCase() !== m2.toUpperCase()) return m1 + ' ' + m2;
  return m1 || m2 || '';
}

function processRows(rows){
  const byClient = {};

  rows.forEach(r => {
    const status = (r['STATUS']||'').toString().trim().toUpperCase();
    if(status !== 'PAGO') return;
    const produtoNorm = normPlan(r['PRODUTO VENDIDO']);
    const isUpgrade = produtoNorm in UPGRADE_MAP;
    const baseTier = baseTierFromProduto(produtoNorm);
    if(!isUpgrade && !baseTier) return; // não é plano/garantia nem upgrade

    const dt = parseBRDate(r['DATA']);
    if(!dt) return;
    if(dt.getFullYear() < 2018 || dt.getFullYear() > 2027) return;

    const cliente = (r['CLIENTE']||'').toString().trim();
    if(!cliente) return;
    const contato = (r['CONTATO']||'').toString().trim();
    const precoRaw = r['PREÇO'];
    const precoNum = typeof precoRaw === 'number' ? precoRaw : parseFloat(String(precoRaw||'').replace(/[^\d,.-]/g,'').replace(',','.'));
    const preco = isNaN(precoNum) ? null : precoNum;

    const key = cliente.toUpperCase();
    if(!byClient[key]) byClient[key] = [];
    byClient[key].push({ cliente, dt, produtoNorm, isUpgrade, baseTier, contato, preco, modelo: extractModelo(r), consumed: false, linkedFrom: null });
  });

  const LINK_WINDOW_DAYS = 5; // upgrade acontece normalmente no mesmo dia ou dia seguinte da venda original
  const devices = [];

  Object.values(byClient).forEach(events => {
    events.sort((a, b) => a.dt - b.dt);

    // Tenta casar cada upgrade com a compra-base mais próxima (mesmo cliente, nível compatível, poucos dias antes)
    events.filter(e => e.isUpgrade).forEach(ev => {
      const info = UPGRADE_MAP[ev.produtoNorm];
      let bestMatch = null;
      events.forEach(other => {
        if(other.isUpgrade || other.consumed) return;
        if(other.dt > ev.dt) return;
        const gap = diffDays(other.dt, ev.dt);
        if(gap < 0 || gap > LINK_WINDOW_DAYS) return;
        if(info.origin && other.baseTier !== info.origin) return; // nível não bate com o que o upgrade parte
        if(!bestMatch || other.dt > bestMatch.dt) bestMatch = other;
      });
      if(bestMatch){
        bestMatch.consumed = true; // essa compra-base vira o próprio upgrade, não conta como aparelho separado
        ev.linkedFrom = bestMatch;
      }
    });

    // Cada compra-base que não foi "absorvida" por um upgrade = 1 aparelho independente
    events.filter(e => !e.isUpgrade && !e.consumed).forEach(ev => {
      devices.push(buildDevice(ev.cliente, ev.dt, ev.baseTier, ev.contato, ev.preco, ev.modelo, false));
    });

    // Cada upgrade = 1 aparelho, usando a data do próprio upgrade e o nível final
    events.filter(e => e.isUpgrade).forEach(ev => {
      const info = UPGRADE_MAP[ev.produtoNorm];
      const modelo = ev.modelo || (ev.linkedFrom ? ev.linkedFrom.modelo : '');
      devices.push(buildDevice(ev.cliente, ev.dt, info.dest, ev.contato, ev.preco, modelo, true));
    });
  });

  return devices;
}

function diffDays(a, b){
  const MS = 24*3600*1000;
  const da = new Date(a.getFullYear(), a.getMonth(), a.getDate());
  const db = new Date(b.getFullYear(), b.getMonth(), b.getDate());
  return Math.round((db-da)/MS);
}

function fmtMoney(v){
  if(v === null || v === undefined || isNaN(v)) return null;
  return v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}

function cardHTML(c, refDate){
  const diff = diffDays(refDate, c.venc);
  const elapsed = c.dias - diff;
  const pct = Math.max(0, Math.min(100, Math.round((elapsed / c.dias) * 100)));
  const barColor = diff <= 0 ? 'var(--coral)' : diff <= 7 ? 'var(--amber)' : 'var(--shield)';
  const link = waLink(c.contato, c.cliente, c.produto, c.venc);
  const action = link
    ? `<a class="btn wa" href="${link}" target="_blank" rel="noopener">📲 WhatsApp</a>`
    : `<span class="btn none">Sem contato</span>`;
  const precoStr = fmtMoney(c.preco);
  return `
    <div class="card">
      <div class="who">
        <div class="name">${c.cliente}${c.modelo ? ` <span style="color:var(--muted); font-weight:400; font-size:12.5px;">· ${c.modelo}</span>` : ''}</div>
        <div class="plan">${c.produto} · comprou ${fmtDate(c.data)} · vence ${fmtDate(c.venc)}${precoStr ? ' · ' + precoStr : ''}</div>
      </div>
      <div class="bar-wrap">
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%; background:${barColor}"></div></div>
        <div class="bar-label">${c.dias} dias de garantia</div>
      </div>
      <div class="actions">${action}</div>
    </div>`;
}

let rangeStart = new Date();
let rangeEnd = new Date();
let planFilter = 'ALL';

function startOfWeek(d){
  const r = new Date(d);
  const day = r.getDay(); // 0=domingo
  r.setDate(r.getDate() - day);
  return r;
}
function endOfWeek(d){
  const r = startOfWeek(d);
  r.setDate(r.getDate() + 6);
  return r;
}
function startOfMonth(d){ return new Date(d.getFullYear(), d.getMonth(), 1); }
function endOfMonth(d){ return new Date(d.getFullYear(), d.getMonth()+1, 0); }

function renderForRange(start, end){
  const app = document.getElementById('app');
  const s = new Date(start.getFullYear(), start.getMonth(), start.getDate());
  const e = new Date(end.getFullYear(), end.getMonth(), end.getDate());

  const pool = planFilter === 'ALL' ? ALL_CLIENTS : ALL_CLIENTS.filter(c => c.tier === planFilter);

  const matches = pool.filter(c => {
    const vc = new Date(c.venc.getFullYear(), c.venc.getMonth(), c.venc.getDate());
    return vc >= s && vc <= e;
  });

  const today = new Date();
  const semana = pool.filter(c => { const df = diffDays(today, c.venc); return df >= 1 && df <= 7; });
  const hojeReal = pool.filter(c => diffDays(today, c.venc) === 0);
  const ativos = pool.filter(c => diffDays(today, c.venc) >= 0).length;

  document.querySelector('.summary')?.remove();
  const summaryHTML = `
    <div class="summary">
      <div class="stat hoje"><div class="n">${hojeReal.length}</div><div class="l">Vencendo hoje</div></div>
      <div class="stat semana"><div class="n">${semana.length}</div><div class="l">Próximos 7 dias</div></div>
      <div class="stat"><div class="n">${ativos}</div><div class="l">Clientes com garantia ativa</div></div>
    </div>`;

  const oneDay = dateKey(s) === dateKey(e);
  const title = oneDay
    ? (dateKey(s) === dateKey(today) ? 'Vencendo hoje' : (s < today ? 'Venceram em ' + fmtDate(s) : 'Vão vencer em ' + fmtDate(s)))
    : `Vencimentos de ${fmtDate(s)} até ${fmtDate(e)}`;

  const sorted = matches.sort((a,b) => a.venc - b.venc || a.cliente.localeCompare(b.cliente));
  const comContato = sorted.filter(c => waLink(c.contato, c.cliente, c.produto, c.venc));
  const bulkRow = document.getElementById('bulkRow');
  if(comContato.length > 1){
    bulkRow.style.display = 'block';
    bulkRow.innerHTML = `
      <button class="bulk-btn" id="bulkSendBtn">📲 Abrir conversa com todos (${comContato.length})</button>
      <div class="bulk-note">Abre uma aba do WhatsApp pra cada cliente com contato, em sequência. O navegador pode pedir pra permitir pop-ups na primeira vez.</div>
    `;
    document.getElementById('bulkSendBtn').onclick = () => {
      comContato.forEach((c, i) => {
        setTimeout(() => window.open(waLink(c.contato, c.cliente, c.produto, c.venc), '_blank'), i * 350);
      });
    };
  }else{
    bulkRow.style.display = 'none';
    bulkRow.innerHTML = '';
  }

  app.innerHTML = summaryHTML + `
    <section>
      <div class="sec-head"><h2>${title}</h2></div>
      ${sorted.length ? sorted.map(c => cardHTML(c, today)).join('') : `<div class="empty">Nenhum cliente vence nesse período.</div>`}
    </section>
  `;
}

function setActiveQuickBtn(which){
  ['btnAtrasados','btnToday','btnWeek','btnMonth'].forEach(id => document.getElementById(id).classList.remove('active'));
  if(which) document.getElementById(which).classList.add('active');
}

function setRangeInputs(s, e){
  document.getElementById('dateStart').value = dateKey(s);
  document.getElementById('dateEnd').value = dateKey(e);
}

function applyRange(s, e, btnId){
  rangeStart = s; rangeEnd = e;
  setRangeInputs(s, e);
  setActiveQuickBtn(btnId || null);
  renderForRange(s, e);
}

document.getElementById('dateStart').addEventListener('change', () => {
  const [y,m,d] = document.getElementById('dateStart').value.split('-').map(Number);
  applyRange(new Date(y,m-1,d), rangeEnd, null);
});
document.getElementById('dateEnd').addEventListener('change', () => {
  const [y,m,d] = document.getElementById('dateEnd').value.split('-').map(Number);
  applyRange(rangeStart, new Date(y,m-1,d), null);
});

document.getElementById('btnAtrasados').addEventListener('click', () => {
  // todos os que já venceram, sem limite de data pra trás
  applyRange(new Date(2018,0,1), (() => { const y=new Date(); y.setDate(y.getDate()-1); return y; })(), 'btnAtrasados');
});
document.getElementById('btnToday').addEventListener('click', () => {
  const t = new Date();
  applyRange(t, t, 'btnToday');
});
document.getElementById('btnWeek').addEventListener('click', () => {
  const t = new Date();
  applyRange(startOfWeek(t), endOfWeek(t), 'btnWeek');
});
document.getElementById('btnMonth').addEventListener('click', () => {
  const t = new Date();
  applyRange(startOfMonth(t), endOfMonth(t), 'btnMonth');
});

document.querySelectorAll('#planFilterBtns .qbtn').forEach(btn => {
  btn.addEventListener('click', () => {
    planFilter = btn.dataset.plan;
    document.querySelectorAll('#planFilterBtns .qbtn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    if(ALL_CLIENTS.length) renderForRange(rangeStart, rangeEnd);
  });
});

function fetchViaJSONP(){
  return new Promise((resolve, reject) => {
    const cbName = 'gvizCB_' + Date.now() + '_' + Math.floor(Math.random()*10000);
    const timeout = setTimeout(() => {
      cleanup();
      reject(new Error('Tempo esgotado esperando resposta do Google Sheets.'));
    }, 12000);

    function cleanup(){
      clearTimeout(timeout);
      delete window[cbName];
      if(script.parentNode) script.parentNode.removeChild(script);
    }

    window[cbName] = function(data){
      cleanup();
      resolve(data);
    };

    const script = document.createElement('script');
    script.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json;responseHandler:${cbName}&headers=1&sheet=${encodeURIComponent(SHEET_NAME)}`;
    script.onerror = () => { cleanup(); reject(new Error('Não consegui carregar o script da planilha (verifique o compartilhamento).')); };
    document.body.appendChild(script);
  });
}

function gvizToRows(data){
  if(!data || !data.table) throw new Error('Resposta da planilha em formato inesperado.');
  let cols = data.table.cols.map((c, i) => (c.label && c.label.trim()) ? c.label.trim().toUpperCase() : ('COL' + i));
  let rows = data.table.rows || [];
  console.log('[radar-garantia] colunas detectadas:', cols);
  console.log('[radar-garantia] total de linhas recebidas:', rows.length);

  // fallback: se os cabeçalhos não vieram (ex: "COL0","COL1"...), usa a primeira linha de dados como cabeçalho
  const essentials = ['STATUS','DATA','CLIENTE','PRODUTO VENDIDO'];
  const hasEssentials = essentials.every(h => cols.includes(h));
  if(!hasEssentials && rows.length){
    console.log('[radar-garantia] cabeçalhos não bateram, usando fallback (primeira linha como header)');
    const first = rows[0].c || [];
    cols = first.map((cell, i) => {
      const v = cell ? (cell.v !== undefined ? cell.v : cell.f) : null;
      return v ? String(v).trim().toUpperCase() : ('COL' + i);
    });
    rows = rows.slice(1);
    console.log('[radar-garantia] colunas do fallback:', cols);
  }

  const result = rows.map(r => {
    const obj = {};
    (r.c || []).forEach((cell, i) => {
      const key = cols[i] || ('COL' + i);
      obj[key] = cell ? (cell.v !== undefined ? cell.v : '') : '';
    });
    return obj;
  });
  if(result.length){
    console.log('[radar-garantia] exemplo da primeira linha processada:', result[0]);
    const statusSample = [...new Set(result.slice(0,200).map(r => r['STATUS']))];
    console.log('[radar-garantia] valores de STATUS encontrados (amostra):', statusSample);
  }
  return result;
}

async function loadData(){
  const dot = document.getElementById('statusDot');
  const txt = document.getElementById('statusText');
  dot.className = 'status-dot loading';
  txt.textContent = 'carregando dados...';
  try{
    const data = await fetchViaJSONP();
    const rows = gvizToRows(data);

    if(rows.length === 0){
      throw new Error('A planilha respondeu, mas veio sem nenhuma linha de dado.');
    }

    ALL_CLIENTS = processRows(rows);

    if(ALL_CLIENTS.length === 0){
      // Diagnóstico detalhado direto na tela
      const sampleKeys = Object.keys(rows[0] || {});
      const statusVals = [...new Set(rows.slice(0,500).map(r => r['STATUS']).filter(v => v !== '' && v !== null))].slice(0,15);
      const produtoVals = [...new Set(rows.slice(0,500).map(r => r['PRODUTO VENDIDO']).filter(v => v !== '' && v !== null))].slice(0,15);
      const dataVals = rows.slice(0,3).map(r => String(r['DATA']));
      const err = new Error('Nenhuma venda de plano bateu com os critérios.');
      err.diag = { sampleKeys, statusVals, produtoVals, dataVals, totalRows: rows.length };
      throw err;
    }

    dot.className = 'status-dot';
    txt.textContent = `atualizado agora · ${ALL_CLIENTS.length} clientes`;
    const ativosAgora = ALL_CLIENTS.filter(c => diffDays(new Date(), c.venc) >= 0).length;
    document.getElementById('terminalLine').innerHTML = `&gt; monitorando ${ativosAgora} garantias ativas<span class="caret"></span>`;
    document.getElementById('dateStart').value = dateKey(rangeStart);
    document.getElementById('dateEnd').value = dateKey(rangeEnd);
    renderForRange(rangeStart, rangeEnd);
  }catch(err){
    dot.className = 'status-dot err';
    txt.textContent = 'erro ao carregar';
    let diagHTML = '';
    if(err.diag){
      diagHTML = `
        <br><br><b>Diagnóstico:</b><br>
        Total de linhas recebidas: ${err.diag.totalRows}<br>
        Colunas encontradas: <code>${err.diag.sampleKeys.join(', ')}</code><br>
        Valores de STATUS vistos: <code>${err.diag.statusVals.map(v=>JSON.stringify(v)).join(', ') || '(nenhum)'}</code><br>
        Valores de PRODUTO VENDIDO vistos: <code>${err.diag.produtoVals.map(v=>JSON.stringify(v)).join(', ') || '(nenhum)'}</code><br>
        Exemplos de DATA (linha 1-3): <code>${err.diag.dataVals.join(' | ')}</code>
      `;
    }
    document.getElementById('app').innerHTML = `
      <div class="errbox">
        <b>Não consegui montar a lista de clientes.</b><br><br>
        ${err.message}
        ${diagHTML}
      </div>`;
  }
}

loadData();
setInterval(loadData, 5 * 60 * 1000); // busca dados novos da planilha a cada 5 min
setInterval(() => {
  if(ALL_CLIENTS.length) renderForRange(rangeStart, rangeEnd); // recalcula "ativos/vencidos" em tempo real, sem refazer a busca
}, 60 * 1000);
</script>
